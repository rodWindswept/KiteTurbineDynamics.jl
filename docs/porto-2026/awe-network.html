const W = window.innerWidth, H = window.innerHeight;

const svg = d3.select("#graph").append("svg")
  .attr("width", W).attr("height", H);

const g = svg.append("g");

// Zoom
const zoom = d3.zoom().scaleExtent([0.1, 6]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2));

// Tooltip
const tip = d3.select("#tooltip");

// Scales
const sizeScale = d3.scaleSqrt().domain([1, 74]).range([5, 40]);
const linkScale = d3.scaleLinear().domain([1, 13]).range([0.3, 3]);

// Simulation
const sim = d3.forceSimulation(DATA.nodes)
  .force("link", d3.forceLink(DATA.edges).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(0, 0))
  .force("collision", d3.forceCollide().radius(d => sizeScale(d.papers) + 4));

// Links
const link = g.append("g").selectAll("line")
  .data(DATA.edges).join("line")
  .attr("stroke", "#334155")
  .attr("stroke-width", d => linkScale(d.weight))
  .attr("stroke-opacity", 0.4);

// Nodes
const node = g.append("g").selectAll("circle")
  .data(DATA.nodes).join("circle")
  .attr("r", d => sizeScale(d.papers))
  .attr("fill", d => d.color)
  .attr("stroke", "#1e293b")
  .attr("stroke-width", 1.5)
  .attr("cursor", "pointer")
  .on("mouseover", (ev, d) => {
    tip.style("opacity", 1)
      .html(`<div class="name">${d.name}</div>
        <div class="detail">📄 ${d.papers} papers · ${d.years}</div>
        <div class="detail">🏛 ${d.affiliation}</div>`);
  })
  .on("mousemove", (ev) => {
    tip.style("left", (ev.pageX+15)+"px").style("top", (ev.pageY-15)+"px");
  })
  .on("mouseout", () => tip.style("opacity", 0))
  .call(d3.drag()
    .on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on("end", (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

// Labels
const label = g.append("g").selectAll("text")
  .data(DATA.nodes).join("text")
  .text(d => d.name)
  .attr("font-size", d => Math.max(8, sizeScale(d.papers) * 0.45))
  .attr("fill", "#94a3b8")
  .attr("text-anchor", "middle")
  .attr("dy", d => sizeScale(d.papers) + 12);

// Tick
sim.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("cx", d => d.x).attr("cy", d => d.y);
  label.attr("x", d => d.x).attr("y", d => d.y);
});

// Minimap
const mini = d3.select("#minimap").append("svg").attr("width", 150).attr("height", 100);
const mg = mini.append("g");
const miniScale = 0.08;
mg.selectAll("circle").data(DATA.nodes).join("circle")
  .attr("cx", d => (d.x || 0) * miniScale + 75)
  .attr("cy", d => (d.y || 0) * miniScale + 50)
  .attr("r", 2)
  .attr("fill", d => d.color)
  .attr("opacity", 0.6);
