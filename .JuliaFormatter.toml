# Shared formatting config so multi-agent commits don't churn on whitespace.
# Run `using JuliaFormatter; format(".")` from the repo root before committing.
style                  = "blue"
indent                 = 4
margin                 = 92
always_for_in          = true
whitespace_typedefs    = true
trailing_comma         = true
normalize_line_endings = "unix"
